<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Choose a new password')}"></head><body class="auth-page"><section class="auth-visual"><div class="auth-shade"></div><a class="brand brand-light" th:href="@{/}"><span class="brand-mark"><svg th:replace="~{fragments/icons :: plane}"></svg></span><span>AeroVista<small>Your Journey, Elevated</small></span></a></section><main class="auth-panel"><div class="auth-box"><a class="auth-back" th:href="@{/login}">Back to sign in</a><span class="eyebrow">SECURE RESET</span><h2>Choose a new password.</h2><div class="flash error" th:if="${invalid}"><span class="alert-mark">!</span><span>This link is invalid or has expired. Request a new one.</span></div><div class="flash error" th:if="${error}"><span class="alert-mark">!</span><span th:text="${error}"></span></div><form th:if="${!invalid}" th:action="@{/reset-password}" th:object="${passwordResetForm}" method="post" data-loading-form><input type="hidden" th:field="*{token}"><div class="field password-field"><label>New password</label><div><input type="password" th:field="*{password}" autocomplete="new-password"><button type="button" data-password-toggle aria-label="Show password"><svg th:replace="~{fragments/icons :: eye}"></svg></button></div><small class="field-error" th:errors="*{password}"></small></div><div class="field password-field"><label>Confirm password</label><div><input type="password" th:field="*{confirmPassword}" autocomplete="new-password"><button type="button" data-password-toggle aria-label="Show password"><svg th:replace="~{fragments/icons :: eye}"></svg></button></div><small class="field-error" th:errors="*{confirmPassword}"></small></div><button class="btn btn-primary btn-block" type="submit">Update password</button></form><a th:if="${invalid}" class="btn btn-primary btn-block" th:href="@{/forgot-password}">Request a new link</a></div></main></body></html>

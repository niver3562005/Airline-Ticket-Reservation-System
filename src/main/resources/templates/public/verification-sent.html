<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Verify your email')}"></head><body class="auth-page"><section class="auth-visual"><div class="auth-shade"></div><a class="brand brand-light" th:href="@{/}"><span class="brand-mark"><svg th:replace="~{fragments/icons :: plane}"></svg></span><span>AeroVista<small>Your Journey, Elevated</small></span></a></section><main class="auth-panel"><div class="auth-box centered-box"><span class="success-mark"><svg th:replace="~{fragments/icons :: ticket}"></svg></span><span class="eyebrow">ONE LAST STEP</span><h2>Verify your email.</h2><p th:if="${registeredEmail}" th:text="${'We prepared a verification link for ' + registeredEmail + '.'}"></p><div class="demo-callout"><strong>Development email simulation</strong><p>No email provider credentials are configured in this educational build. Use the secure link below to simulate opening the verification email.</p></div><a th:if="${verificationUrl}" class="btn btn-primary btn-block" th:href="${verificationUrl}">Verify my email</a><a th:unless="${verificationUrl}" class="btn btn-secondary btn-block" th:href="@{/register}">Create an account</a></div></main></body></html>

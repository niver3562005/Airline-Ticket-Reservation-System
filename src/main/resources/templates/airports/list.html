<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Airports')}"></head><body class="admin-page"><aside th:replace="~{fragments/layout :: sidebar('airports')}"></aside><main class="admin-main"><header class="admin-header"><div><span class="eyebrow">NETWORK</span><h1>Airports</h1><p>Manage destinations and operational availability.</p></div><a class="btn btn-primary" th:href="@{/admin/airports/new}">+ Add airport</a></header><div th:replace="~{fragments/layout :: flash}"></div><section class="admin-card"><div class="table-wrap"><table><thead><tr><th>IATA</th><th>Airport</th><th>Location</th><th>Time zone</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="a : ${airports}"><td><span class="code-chip" th:text="${a.iataCode}"></span></td><td><strong th:text="${a.name}"></strong></td><td th:text="${a.city + ', ' + a.country}"></td><td th:text="${a.timeZone}"></td><td><span class="status" th:classappend="${a.active ? ' status-confirmed' : ' status-cancelled'}" th:text="${a.active ? 'ACTIVE' : 'INACTIVE'}"></span></td><td class="actions"><a th:href="@{/admin/airports/{id}/edit(id=${a.id})}">Edit</a><form th:action="@{/admin/airports/{id}/delete(id=${a.id})}" method="post" data-confirm="Delete this airport?"><button type="submit">Delete</button></form></td></tr></tbody></table></div></section></main></body></html>

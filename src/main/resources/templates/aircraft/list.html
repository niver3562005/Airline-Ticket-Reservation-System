<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Fleet')}"></head><body class="admin-page"><aside th:replace="~{fragments/layout :: sidebar('aircraft')}"></aside><main class="admin-main"><header class="admin-header"><div><span class="eyebrow">FLEET CONTROL</span><h1>Aircraft</h1><p>Configure aircraft capacity and cabin layouts.</p></div><a class="btn btn-primary" th:href="@{/admin/aircraft/new}">Add aircraft</a></header><div th:replace="~{fragments/layout :: flash}"></div><section class="card-grid"><article class="fleet-card" th:each="a : ${aircraftList}"><div class="plane-art"><svg th:replace="~{fragments/icons :: plane}"></svg></div><div class="fleet-top"><span class="code-chip" th:text="${a.registration}"></span><span class="status" th:classappend="${a.active ? ' status-confirmed' : ' status-cancelled'}" th:text="${a.active ? 'ACTIVE' : 'INACTIVE'}"></span></div><h2 th:text="${a.model}"></h2><div class="fleet-stats"><div><strong th:text="${a.capacity}"></strong><span>Total seats</span></div><div><strong th:text="${a.businessRows}"></strong><span>Business rows</span></div><div><strong th:text="${a.economyRows}"></strong><span>Economy rows</span></div></div><div class="card-actions"><a th:href="@{/admin/aircraft/{id}/edit(id=${a.id})}">Edit configuration</a><form th:action="@{/admin/aircraft/{id}/delete(id=${a.id})}" method="post" data-confirm="Delete this aircraft?"><button type="submit">Delete</button></form></div></article></section></main></body></html>

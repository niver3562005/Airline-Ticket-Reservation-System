<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flight editor')}"></head>
<body class="admin-page">
<aside th:replace="~{fragments/layout :: sidebar('flights')}"></aside>
<main class="admin-main narrow">
    <header class="admin-header"><div><a class="back-link" th:href="@{/operations/flights}">← Flight schedule</a><h1 th:text="${flight.id == null ? 'Schedule a flight' : 'Edit flight'}"></h1><p>Set route, timing, service package, disruption alert, aircraft and published fares.</p></div></header>
    <form th:action="@{/operations/flights}" th:object="${flight}" method="post" class="admin-card entity-form">
        <input type="hidden" th:field="*{id}"><div class="form-error full" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <h3 class="form-section-title">Flight identity</h3>
        <div class="form-grid"><div class="field"><label>Flight number</label><input th:field="*{flightNumber}" placeholder="AN204"><small class="field-error" th:errors="*{flightNumber}"></small></div><div class="field"><label>Aircraft</label><select name="aircraftId" required><option value="">Choose aircraft</option><option th:each="a : ${aircraftList}" th:value="${a.id}" th:selected="${flight.aircraft != null and flight.aircraft.id == a.id}" th:text="${a.registration + ' · ' + a.model + ' · ' + a.capacity + ' seats'}"></option></select></div><div class="field"><label>Origin</label><select name="originId" required><option value="">Choose origin</option><option th:each="a : ${airports}" th:value="${a.id}" th:selected="${flight.origin != null and flight.origin.id == a.id}" th:text="${a.displayName}"></option></select></div><div class="field"><label>Destination</label><select name="destinationId" required><option value="">Choose destination</option><option th:each="a : ${airports}" th:value="${a.id}" th:selected="${flight.destination != null and flight.destination.id == a.id}" th:text="${a.displayName}"></option></select></div></div>
        <h3 class="form-section-title">Schedule & operations</h3>
        <div class="form-grid"><div class="field"><label>Departure</label><input type="datetime-local" th:field="*{departureAt}" required></div><div class="field"><label>Arrival</label><input type="datetime-local" th:field="*{arrivalAt}" required></div><div class="field"><label>Departure gate</label><input th:field="*{departureGate}" placeholder="4"></div><div class="field"><label>Status</label><select th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div><div class="field"><label>Delay (minutes)</label><input type="number" min="0" max="1440" th:field="*{delayMinutes}"></div><div class="field"><label>Delay alert message</label><input th:field="*{delayReason}" maxlength="240" placeholder="Late inbound aircraft"></div></div>
        <h3 class="form-section-title">Fares, baggage & onboard package</h3>
        <div class="form-grid"><div class="field"><label>Economy fare (LKR)</label><input type="number" min="1" step="0.01" th:field="*{economyFare}"></div><div class="field"><label>Premium Economy fare (LKR)</label><input type="number" min="1" step="0.01" th:field="*{premiumEconomyFare}"></div><div class="field"><label>Business fare (LKR)</label><input type="number" min="1" step="0.01" th:field="*{businessFare}"></div><div class="field"><label>First fare (LKR)</label><input type="number" min="1" step="0.01" th:field="*{firstFare}"></div><div class="field"><label>Economy baggage allowance (kg)</label><input type="number" min="0" max="60" th:field="*{baggageAllowanceKg}"></div><div class="field"><label>Fare package</label><input th:field="*{fareBrand}" maxlength="40" placeholder="Vista Smart"></div><div class="field span-2"><label>Onboard features</label><input th:field="*{onboardFeatures}" maxlength="240" placeholder="Meal · Wi-Fi messaging · USB power"></div></div>
        <div class="form-actions"><a class="btn btn-secondary" th:href="@{/operations/flights}">Cancel</a><button class="btn btn-primary" type="submit">Save flight</button></div>
    </form>
</main>
</body></html>

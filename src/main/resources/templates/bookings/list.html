<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Bookings')}"></head><body class="admin-page"><aside th:replace="~{fragments/layout :: sidebar('bookings')}"></aside><main class="admin-main"><header class="admin-header"><div><span class="eyebrow">PASSENGER SERVICES</span><h1>Bookings</h1><p>Review reservations, passenger manifests and payment status.</p></div></header><section class="admin-card"><div class="table-tools"><input class="table-search" data-table-search placeholder="Search PNR, passenger, email or flight…"><span th:text="${bookings.size() + ' bookings'}"></span></div><div class="table-wrap"><table data-filter-table><thead><tr><th>PNR</th><th>Contact</th><th>Journey</th><th>Departure</th><th>Travellers</th><th>Total</th><th>Status</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td><a th:href="@{/admin/bookings/{pnr}(pnr=${b.pnr})}" th:text="${b.pnr}"></a></td><td><strong th:text="${b.contactName}"></strong><small th:text="${b.contactEmail}"></small></td><td><strong th:text="${b.flight.origin.iataCode + ' → ' + b.flight.destination.iataCode}"></strong><small th:text="${b.flight.flightNumber}"></small></td><td th:text="${#temporals.format(b.flight.departureAt, 'dd MMM · HH:mm')}"></td><td th:text="${b.passengers.size()}"></td><td th:text="${'LKR ' + #numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')}"></td><td><span class="status" th:classappend="${' status-' + #strings.toLowerCase(b.status)}" th:text="${b.status}"></span></td></tr><tr th:if="${bookings.isEmpty()}"><td colspan="7" class="empty-cell">No bookings have been created yet.</td></tr></tbody></table></div></section></main></body></html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Booking details')}"></head>
<body class="admin-page">
<aside th:replace="~{fragments/layout :: sidebar('bookings')}"></aside>
<main class="admin-main">
    <header class="admin-header"><div><a class="back-link" th:href="@{/admin/bookings}">Back to bookings</a><h1 th:text="${'Booking ' + booking.pnr}"></h1><p th:text="${'Created ' + #temporals.format(booking.createdAt, 'dd MMM yyyy · HH:mm')}"></p></div><span class="status large" th:classappend="${' status-' + #strings.toLowerCase(booking.status)}" th:text="${booking.status}"></span></header>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="detail-grid booking-ops-grid">
        <section class="admin-card"><div class="card-heading"><div><h2>Passenger readiness manifest</h2><p th:text="${booking.passengers.size() + ' traveller(s) · updates trigger passenger alerts'}"></p></div></div><div class="passenger-ops-list"><article th:each="p : ${booking.passengers}"><div class="passenger-ops-identity"><span class="avatar" th:text="${p.firstName.substring(0,1) + p.lastName.substring(0,1)}"></span><div><strong th:text="${p.fullName}"></strong><small th:text="${p.passportNumber + ' · ' + p.cabinClass + ' · Seat ' + p.seatNumber}"></small><small th:if="${p.specialAssistance}" th:text="${'Assistance: ' + p.specialAssistance}"></small></div></div><form th:action="@{/admin/bookings/{pnr}/passengers/{id}/status(pnr=${booking.pnr},id=${p.id})}" method="post"><label>Security<select name="securityStatus"><option th:each="status : ${securityStatuses}" th:value="${status}" th:text="${#strings.replace(status, '_', ' ')}" th:selected="${status == p.securityStatus}"></option></select></label><label>Boarding<select name="boardingStatus"><option th:each="status : ${boardingStatuses}" th:value="${status}" th:text="${#strings.replace(status, '_', ' ')}" th:selected="${status == p.boardingStatus}"></option></select></label><button class="btn btn-primary btn-small" type="submit">Update & notify</button></form><div class="passenger-ops-meta"><span th:class="${p.checkedIn ? 'status status-confirmed' : 'status status-pending'}" th:text="${p.checkedIn ? 'CHECKED IN' : 'NOT CHECKED IN'}"></span><span th:if="${p.boardingGroup}" class="code-chip" th:text="${p.boardingGroup}"></span><span th:if="${p.mealPreference}" th:text="${p.mealPreference}"></span></div></article></div></section>
        <aside class="admin-card flight-info"><h2>Booking summary</h2><div class="summary-row"><span>Contact</span><strong th:text="${booking.contactName}"></strong></div><div class="summary-row"><span>Email</span><strong th:text="${booking.contactEmail}"></strong></div><div class="summary-row"><span>Phone</span><strong th:text="${booking.contactPhone}"></strong></div><div class="summary-row"><span>Flight</span><strong th:text="${booking.flight.flightNumber}"></strong></div><div class="summary-row"><span>Route</span><strong th:text="${booking.flight.origin.iataCode + ' → ' + booking.flight.destination.iataCode}"></strong></div><div class="summary-row"><span>Flight status</span><span class="status status-scheduled" th:text="${booking.flight.status}"></span></div><div class="summary-row"><span>Promo</span><strong th:text="${booking.promoCode ?: '—'}"></strong></div><hr><div class="summary-row total"><span>Total</span><strong th:text="${'LKR ' + #numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 2, 'POINT')}"></strong></div><a class="btn btn-secondary btn-block" th:href="@{/admin/service-center}">Open service centre</a></aside>
    </div>
</main>
</body>
</html>

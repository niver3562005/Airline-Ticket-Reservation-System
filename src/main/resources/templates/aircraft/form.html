<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Aircraft editor')}"></head><body class="admin-page"><aside th:replace="~{fragments/layout :: sidebar('aircraft')}"></aside><main class="admin-main narrow"><header class="admin-header"><div><a class="back-link" th:href="@{/admin/aircraft}">← Fleet</a><h1 th:text="${aircraft.id == null ? 'Add aircraft' : 'Edit aircraft'}"></h1><p>Seat maps are generated automatically from this four-cabin configuration.</p></div></header><form th:action="@{/admin/aircraft}" th:object="${aircraft}" method="post" class="admin-card entity-form"><input type="hidden" th:field="*{id}"><div class="form-error full" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><div class="field"><label>Registration</label><input th:field="*{registration}" placeholder="4R-ANA"></div><div class="field"><label>Aircraft model</label><input th:field="*{model}" placeholder="Airbus A320neo"></div><div class="field"><label>First rows</label><input type="number" min="0" max="10" th:field="*{firstRows}"></div><div class="field"><label>Business rows</label><input type="number" min="0" max="10" th:field="*{businessRows}"></div><div class="field"><label>Premium Economy rows</label><input type="number" min="0" max="15" th:field="*{premiumEconomyRows}"></div><div class="field"><label>Economy rows</label><input type="number" min="1" max="50" th:field="*{economyRows}"></div><div class="field"><label>Seats per row</label><input type="number" min="4" max="10" th:field="*{seatsPerRow}"></div><label class="check-field"><input type="checkbox" th:field="*{active}"><span>Aircraft is active</span></label></div><div class="form-actions"><a class="btn btn-secondary" th:href="@{/admin/aircraft}">Cancel</a><button class="btn btn-primary" type="submit">Save aircraft</button></div></form></main></body></html>

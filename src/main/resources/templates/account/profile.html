<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Profile & preferences')}"></head><body class="public-page soft-bg"><nav th:replace="~{fragments/layout :: publicNav}"></nav><main class="section profile-page"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><a class="back-link" th:href="@{/account}">Back to my journeys</a><span class="eyebrow">MY ACCOUNT</span><h1>Profile & preferences</h1><p>Keep your details current for a faster booking experience.</p></div><div class="profile-identity"><span class="member-avatar" th:text="${account.initials}">AP</span><div><strong th:text="${account.fullName}"></strong><span th:text="${account.loyaltyNumber}"></span></div></div></div><div class="profile-grid"><form class="panel" th:action="@{/account/profile}" th:object="${profileForm}" method="post"><div class="panel-head"><div><h2>Personal details</h2><p>These details prefill your next reservation.</p></div></div><div class="form-grid"><div class="field"><label>First name</label><input th:field="*{firstName}" autocomplete="given-name"><small class="field-error" th:errors="*{firstName}"></small></div><div class="field"><label>Last name</label><input th:field="*{lastName}" autocomplete="family-name"><small class="field-error" th:errors="*{lastName}"></small></div><div class="field span-2"><label>Email address</label><input type="email" th:value="${account.email}" disabled><small>Verified login email</small></div><div class="field span-2"><label>Mobile number</label><input th:field="*{phone}" autocomplete="tel"><small class="field-error" th:errors="*{phone}"></small></div><label class="check-field simple span-2"><input type="checkbox" th:field="*{marketingOptIn}"><span>Send occasional fare and destination updates.</span></label></div><div class="form-actions"><button class="btn btn-primary" type="submit">Save profile</button></div></form><form class="panel" th:action="@{/account/password}" th:object="${passwordChangeForm}" method="post"><div class="panel-head"><div><h2>Security</h2><p>Choose a strong, unique password.</p></div></div><div class="field password-field"><label>Current password</label><div><input type="password" th:field="*{currentPassword}" autocomplete="current-password"><button type="button" data-password-toggle aria-label="Show password"><svg th:replace="~{fragments/icons :: eye}"></svg></button></div><small class="field-error" th:errors="*{currentPassword}"></small></div><div class="field password-field"><label>New password</label><div><input type="password" th:field="*{newPassword}" autocomplete="new-password"><button type="button" data-password-toggle aria-label="Show password"><svg th:replace="~{fragments/icons :: eye}"></svg></button></div><small>8+ characters with upper, lowercase and a number.</small><small class="field-error" th:errors="*{newPassword}"></small></div><div class="field password-field"><label>Confirm new password</label><div><input type="password" th:field="*{confirmPassword}" autocomplete="new-password"><button type="button" data-password-toggle aria-label="Show password"><svg th:replace="~{fragments/icons :: eye}"></svg></button></div><small class="field-error" th:errors="*{confirmPassword}"></small></div><div class="form-actions"><button class="btn btn-secondary" type="submit">Change password</button></div></form></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>

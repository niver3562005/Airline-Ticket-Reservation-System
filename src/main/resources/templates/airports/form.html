<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Airport editor')}"></head><body class="admin-page"><aside th:replace="~{fragments/layout :: sidebar('airports')}"></aside><main class="admin-main narrow"><header class="admin-header"><div><a class="back-link" th:href="@{/admin/airports}">← Airports</a><h1 th:text="${airport.id == null ? 'Add an airport' : 'Edit airport'}"></h1><p>Maintain accurate station information used throughout flight scheduling.</p></div></header><form th:action="@{/admin/airports}" th:object="${airport}" method="post" class="admin-card entity-form"><input type="hidden" th:field="*{id}"><div class="form-error full" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><div class="form-grid"><div class="field"><label>IATA code</label><input th:field="*{iataCode}" maxlength="3" placeholder="CMB"><small class="field-error" th:errors="*{iataCode}"></small></div><div class="field"><label>Airport name</label><input th:field="*{name}" placeholder="Bandaranaike International Airport"></div><div class="field"><label>City</label><input th:field="*{city}" placeholder="Colombo"></div><div class="field"><label>Country</label><input th:field="*{country}" placeholder="Sri Lanka"></div><div class="field span-2"><label>IANA time zone</label><input th:field="*{timeZone}" placeholder="Asia/Colombo"></div><label class="check-field span-2"><input type="checkbox" th:field="*{active}"><span>Airport is active and available for scheduling</span></label></div><div class="form-actions"><a class="btn btn-secondary" th:href="@{/admin/airports}">Cancel</a><button class="btn btn-primary" type="submit">Save airport</button></div></form></main></body></html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flight schedule')}"></head>
<body class="admin-page"><aside th:replace="~{fragments/layout :: sidebar('flights')}"></aside>
<main class="admin-main"><header class="admin-header"><div><span class="eyebrow">OPERATIONS</span><h1>Flight schedule</h1><p>Plan routes, service packages, aircraft and passenger disruption alerts.</p></div><a class="btn btn-primary" th:href="@{/admin/flights/new}">+ Schedule flight</a></header><div th:replace="~{fragments/layout :: flash}"></div>
<section class="admin-card"><div class="table-tools"><input class="table-search" data-table-search placeholder="Search flight, airport or aircraft…"><span th:text="${flights.size() + ' scheduled flights'}"></span></div><div class="table-wrap"><table data-filter-table><thead><tr><th>Flight</th><th>Route</th><th>Schedule</th><th>Aircraft</th><th>Package</th><th>Fare from</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="f : ${flights}"><td><div th:replace="~{fragments/layout :: flightIdentity(${f})}"></div><small th:text="${'Gate ' + (f.departureGate ?: 'TBA')}"></small></td><td><strong th:text="${f.origin.iataCode + ' → ' + f.destination.iataCode}"></strong><small th:text="${f.origin.city + ' to ' + f.destination.city}"></small></td><td><strong th:text="${#temporals.format(f.departureAt, 'dd MMM yyyy')}"></strong><small th:text="${#temporals.format(f.estimatedDepartureAt, 'HH:mm') + ' · ' + f.durationLabel}"></small><small class="delay-copy" th:if="${f.delayed}" th:text="${'+' + f.delayMinutes + ' min · ' + f.delayReason}"></small></td><td><strong th:text="${f.aircraft.registration}"></strong><small th:text="${f.aircraft.model}"></small></td><td><strong th:text="${f.fareBrand}"></strong><small th:text="${f.baggageAllowanceKg + ' kg'}"></small></td><td th:text="${'LKR ' + #numbers.formatDecimal(f.economyFare, 0, 'COMMA', 0, 'POINT')}"></td><td><form th:action="@{/admin/flights/{id}/status(id=${f.id})}" method="post"><select class="status-select" name="status" onchange="this.form.submit()"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == f.status}"></option></select></form></td><td class="actions"><a th:href="@{/admin/flights/{id}/edit(id=${f.id})}">Edit</a><form th:action="@{/admin/flights/{id}/delete(id=${f.id})}" method="post" data-confirm="Delete this flight?"><button type="submit">Delete</button></form></td></tr></tbody></table></div></section>
</main></body></html>
